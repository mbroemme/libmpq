name: Build D package

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: validate
      assemble_release:
        type: boolean
        required: false
        default: false
    outputs:
      package_version:
        value: ${{ jobs.prepare.outputs.package_version }}
  workflow_dispatch:
    inputs:
      mode:
        description: D package build mode
        type: choice
        required: true
        default: validate
        options: [validate, release]
      assemble_release:
        description: Assemble the canonical outer D release ZIP
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Derive D package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.metadata.outputs.package_version }}
    steps:
      - name: Install metadata dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake build-essential libbz2-dev liblzma-dev libtool zlib1g-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd
      - id: metadata
        name: Validate versions and inputs
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in validate|release) ;; *)
            echo "Unsupported D package mode: ${{ inputs.mode }}" >&2; exit 1;; esac
          if [[ "${{ inputs.assemble_release }}" == true ]] &&
              [[ "${{ inputs.mode }}" != release || "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo 'assemble_release=true requires mode=release and a v* tag ref' >&2
            exit 1
          fi
          sh autogen.sh
          ./configure --prefix=/usr
          project_version="$(./configure --version | sed -n '1s/^libmpq configure //p')"
          test -n "${project_version}"
          describe="$(mktemp)"
          trap 'rm -f -- "${describe}"' EXIT
          dub describe > "${describe}"
          read -r package_name dub_version < <(
            python - "${describe}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              metadata = json.load(source)
          package = next(p for p in metadata["packages"] if p["name"] == "libmpq")
          print(package["name"], package["version"])
          PY
          )
          test "${package_name}" = libmpq
          test -n "${dub_version}"
          package_version="${project_version}"
          if [[ "${{ inputs.mode }}" == release ]]; then
            [[ "${GITHUB_REF}" == refs/tags/v* ]] || {
              echo 'release mode requires a v* Git tag ref' >&2; exit 1; }
            tag_version="${GITHUB_REF_NAME#v}"
            test "${tag_version}" = "${project_version}"
            test "${tag_version}" = "${dub_version}"
            package_version="${tag_version}"
          fi
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"

  binary-glibc:
    name: Build D ${{ matrix.compiler.name }} glibc ${{ matrix.architecture }} package
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:

        # The current Linux DMD release toolchain is x86_64-only; LDC supplies native aarch64.
        include:
          - compiler: {name: dmd, setup: dmd, dub: dmd}
            architecture: x86_64
            runner: ubuntu-24.04
          - compiler: {name: ldc, setup: ldc, dub: ldc2}
            architecture: x86_64
            runner: ubuntu-24.04
          - compiler: {name: ldc, setup: ldc, dub: ldc2}
            architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install glibc package dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake binutils build-essential jq libbz2-dev liblzma-dev libtool zlib1g-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler.setup }}
      - name: Build and validate binary package
        env:
          LIBMPQ_D_COMPILER_NAME: ${{ matrix.compiler.name }}
          LIBMPQ_D_DUB_COMPILER: ${{ matrix.compiler.dub }}
          LIBMPQ_D_LIBC: glibc
          LIBMPQ_D_OS: linux
          LIBMPQ_D_ARCHITECTURE: ${{ matrix.architecture }}
          LIBMPQ_D_VERSION: ${{ needs.prepare.outputs.package_version }}
          DC: ${{ matrix.compiler.dub }}
        run: bash scripts/build-d-binary-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libmpq-d-${{ matrix.compiler.name }}-glibc-${{ matrix.architecture }}-package
          path: release/libmpq-d-*-linux-glibc-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  binary-musl:
    name: Build D ${{ matrix.compiler.name }} musl ${{ matrix.architecture }} package
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:

        # Alpine 3.22 provides DMD on x86_64 and LDC on both architectures.
        include:
          - compiler: {name: dmd, package: dmd, dub: dmd, dc: dmd}
            architecture: x86_64
            runner: ubuntu-24.04
          - compiler: {name: ldc, package: ldc, dub: ldc2, dc: ldc2}
            architecture: x86_64
            runner: ubuntu-24.04
          - compiler: {name: ldc, package: ldc, dub: ldc2, dc: ldc2}
            architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and validate Alpine binary package
        env:
          LIBMPQ_D_COMPILER_NAME: ${{ matrix.compiler.name }}
          LIBMPQ_D_DUB_COMPILER: ${{ matrix.compiler.dub }}
          LIBMPQ_D_COMPILER_PACKAGE: ${{ matrix.compiler.package }}
          LIBMPQ_D_DC: ${{ matrix.compiler.dc }}
          LIBMPQ_D_LIBC: musl
          LIBMPQ_D_OS: linux
          LIBMPQ_D_ARCHITECTURE: ${{ matrix.architecture }}
          LIBMPQ_D_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "${LIBMPQ_D_ARCHITECTURE}"
          docker run --rm \
            -e LIBMPQ_D_COMPILER_NAME -e LIBMPQ_D_DUB_COMPILER \
            -e LIBMPQ_D_COMPILER_PACKAGE -e LIBMPQ_D_DC -e LIBMPQ_D_LIBC \
            -e LIBMPQ_D_VERSION -e LIBMPQ_D_ARCHITECTURE -e LIBMPQ_D_OS \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace alpine:3.22 sh -euxc '
              apk add --no-cache autoconf automake bash binutils bzip2-dev \
                build-base ca-certificates dub jq libtool linux-headers \
                "${LIBMPQ_D_COMPILER_PACKAGE}" tar xz-dev zlib-dev
              export DC="${LIBMPQ_D_DC}"
              bash scripts/build-d-binary-package.sh
            '
      - uses: actions/upload-artifact@v7
        with:
          name: libmpq-d-${{ matrix.compiler.name }}-musl-${{ matrix.architecture }}-package
          path: release/libmpq-d-*-linux-musl-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  binary-macos:
    name: Build D ${{ matrix.compiler }} macOS ${{ matrix.architecture }} package
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: dmd
            dc: dmd
            architecture: x86_64
            runner: macos-15-intel
          - compiler: dmd
            dc: dmd
            architecture: arm64
            runner: macos-15
          - compiler: ldc
            dc: ldc2
            architecture: x86_64
            runner: macos-15-intel
          - compiler: ldc
            dc: ldc2
            architecture: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install macOS build prerequisites
        run: |
          set -euxo pipefail
          test "$(uname -m)" = '${{ matrix.architecture }}'
          brew install autoconf automake libtool pkg-config xz jq
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "${GITHUB_PATH}"
      - name: Allow the DMD compiler host under Rosetta
        if: matrix.compiler == 'dmd' && matrix.architecture == 'arm64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Build and validate macOS D package
        env:
          LIBMPQ_D_OS: macos
          LIBMPQ_D_COMPILER_NAME: ${{ matrix.compiler }}
          LIBMPQ_D_DUB_COMPILER: ${{ matrix.dc }}
          LIBMPQ_D_ARCHITECTURE: ${{ matrix.architecture }}
          LIBMPQ_D_VERSION: ${{ needs.prepare.outputs.package_version }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          DC: ${{ matrix.dc }}
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "${LIBMPQ_D_ARCHITECTURE}"
          CC="$(xcrun --sdk macosx --find clang)"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"

          # Match the native SDK: xz supplies headers, not Homebrew libraries.
          CPPFLAGS="-I$(brew --prefix xz)/include ${CPPFLAGS:-}"
          export CC SDKROOT CPPFLAGS
          "${CC}" --version
          file "$(command -v "${DC}")"
          if [[ "${LIBMPQ_D_COMPILER_NAME}" == ldc ]]; then
            /usr/bin/arch -"${LIBMPQ_D_ARCHITECTURE}" "${DC}" --version
          else
            "${DC}" --version
          fi
          dub --version
          bash scripts/build-d-binary-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libmpq-d-${{ matrix.compiler }}-macos-${{ matrix.architecture }}-package
          path: release/libmpq-d-*-macos-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  binary-windows:
    name: Build D ${{ matrix.compiler }} Windows x86_64 package
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: dmd
            dc: dmd
            runner: windows-latest
          - compiler: ldc
            dc: ldc2
            runner: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Install native MSVC dependencies
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ine 'X64') { throw 'Native runner architecture mismatch' }
          & "${env:VCPKG_INSTALLATION_ROOT}/vcpkg.exe" install zlib:x64-windows bzip2:x64-windows liblzma:x64-windows
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
      - name: Build, test, install, and package Windows D binding
        env:
          LIBMPQ_D_OS: windows
          LIBMPQ_D_ARCHITECTURE: x86_64
          LIBMPQ_D_COMPILER_NAME: ${{ matrix.compiler }}
          LIBMPQ_D_DUB_COMPILER: ${{ matrix.dc }}
          LIBMPQ_D_VERSION: ${{ needs.prepare.outputs.package_version }}
          DC: ${{ matrix.dc }}
        run: |
          ${vswhere} = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          ${vs} = & ${vswhere} -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "${vs}/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath "${vs}" -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach (${tool} in 'cl.exe', 'link.exe', 'lib.exe', 'dumpbin.exe') {
            ${resolved} = (Get-Command ${tool} -ErrorAction Stop).Source
            if (-not ${resolved}.StartsWith(${vs}, [StringComparison]::OrdinalIgnoreCase)) { throw "Unexpected MSVC tool: ${resolved}" }
          }
          ${env:LINKCMD64} = (Get-Command link.exe).Source
          ${env:LIBMPQ_D_MSVC_BIN} = Split-Path (Get-Command cl.exe).Source
          & ${env:DC} --version
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          dub --version
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          cmake -S . -B build -A x64 -DVCPKG_TARGET_TRIPLET=x64-windows -DBUILD_SHARED_LIBS=ON "-DCMAKE_TOOLCHAIN_FILE=${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          cmake --build build --config Release --parallel
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          ctest --test-dir build -C Release --output-on-failure
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          ${name} = "libmpq-${env:LIBMPQ_D_VERSION}-windows-msvc-x64"
          ${stage} = "${env:GITHUB_WORKSPACE}/release/${name}"
          if (Test-Path ${stage}) { throw 'Staging directory already exists' }
          cmake --install build --config Release --prefix "${stage}"
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          ${bash} = "${env:ProgramFiles}/Git/bin/bash.exe"
          ${env:PATH} = "${env:ProgramFiles}/7-Zip;${env:PATH}"
          & ${bash} scripts/package-windows.sh prepare --toolchain msvc --architecture x64 --stage "${stage}" --runtime "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows" --output "${env:RUNNER_TEMP}/${name}.zip" --version "${env:LIBMPQ_D_VERSION}"
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          & ${bash} scripts/build-d-binary-package.sh
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
      - uses: actions/upload-artifact@v7
        with:
          name: libmpq-d-${{ matrix.compiler }}-windows-x86_64-package
          path: release/libmpq-d-*-windows-x86_64.zip
          if-no-files-found: error

  source:
    name: Build D source package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install source package dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake binutils build-essential jq libbz2-dev liblzma-dev libtool zlib1g-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd
      - name: Build native library and validate source package
        env:
          LIBMPQ_D_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euxo pipefail
          sh autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)" V=1
          bash scripts/package-d-source.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libmpq-d-source-package
          path: release/libmpq-d-*-source.tar.gz
          if-no-files-found: error

  package:
    if: inputs.assemble_release
    name: Package D release
    needs: [prepare, binary-glibc, binary-musl, binary-macos, binary-windows, source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip zip
      - uses: actions/download-artifact@v8
        with:
          pattern: libmpq-d-*-package
          path: release/packages
          merge-multiple: true
      - name: Assemble D release ZIP
        env:
          LIBMPQ_D_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euxo pipefail
          package_name="libmpq-d-${LIBMPQ_D_VERSION}"
          mkdir -p release/package
          mapfile -t packages < <(find release/packages -type f \( -name "${package_name}-*.tar.gz" -o -name "${package_name}-*.zip" \) -printf '%f\n' | sort)
          expected=("${package_name}-source.tar.gz")
          for libc in glibc musl; do
            for target in dmd:x86_64 ldc:x86_64 ldc:aarch64; do
              expected+=("${package_name}-${target%:*}-linux-${libc}-${target#*:}.tar.gz")
            done
          done
          for compiler in dmd ldc; do
            expected+=("${package_name}-${compiler}-windows-x86_64.zip")
            for architecture in x86_64 arm64; do
              expected+=("${package_name}-${compiler}-macos-${architecture}.tar.gz")
            done
          done
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${packages[@]}")
          for package in "${packages[@]}"; do cp "release/packages/${package}" release/package/; done
          (cd release/package && zip -q "../${package_name}.zip" ./*)
          unzip -t "release/${package_name}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: libmpq-d-release
          path: release/libmpq-d-*.zip
          if-no-files-found: error
