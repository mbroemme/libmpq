name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  merge_group:

permissions:
  contents: read

jobs:
  native-windows:
    name: Native Windows ${{ matrix.architecture_label }} (MSVC)
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            architecture_label: x64
            runner: windows-latest
            cmake_platform: x64
            vcpkg_triplet: x64-windows
            dev_arch: x64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            machine: '8664'
          - architecture: arm64
            architecture_label: ARM64
            runner: windows-11-vs2026-arm
            cmake_platform: ARM64
            vcpkg_triplet: arm64-windows
            dev_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            machine: 'AA64'
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ine '${{ matrix.architecture }}') { throw 'Native runner architecture mismatch' }
          & "${env:VCPKG_INSTALLATION_ROOT}/vcpkg.exe" install zlib:${{ matrix.vcpkg_triplet }} bzip2:${{ matrix.vcpkg_triplet }} liblzma:${{ matrix.vcpkg_triplet }}
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.cmake_platform }} -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} -DBUILD_SHARED_LIBS=ON -DVCPKG_APPLOCAL_DEPS=OFF "-DCMAKE_TOOLCHAIN_FILE=${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: |
          # Parallel app-local DLL copying can race between test targets.
          # Resolve vcpkg DLLs from PATH instead of deploying them at build time.
          ${env:PATH} = "${env:VCPKG_INSTALLATION_ROOT}/installed/${{ matrix.vcpkg_triplet }}/bin;${env:PATH}"
          ctest --test-dir build -C Release --parallel 1 --no-tests=error --output-on-failure
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
      - name: Verify native architecture
        shell: pwsh
        run: |
          ${vswhere} = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          ${vs} = & ${vswhere} -latest -products '*' -requires ${{ matrix.vs_component }} -property installationPath
          Import-Module "${vs}/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath "${vs}" -SkipAutomaticLocation -DevCmdArguments '-arch=${{ matrix.dev_arch }} -host_arch=${{ matrix.dev_arch }}'

          ${binary} = 'build/Release/mpq.dll'
          ${headers} = & dumpbin.exe /nologo /headers ${binary}
          if (${LASTEXITCODE}) { exit ${LASTEXITCODE} }
          if (-not (${headers} -match '^\s*${{ matrix.machine }}\s+machine\s+\(')) { throw "PE architecture mismatch: ${binary}" }

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Install lint dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget
          mkdir -p /etc/apt/keyrings
          wget -qO /etc/apt/keyrings/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          chmod 0644 /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            7zip \
            autoconf \
            automake \
            bear \
            build-essential \
            clang-22 \
            clang-format-22 \
            clang-tidy-22 \
            ca-certificates \
            git \
            libbz2-dev \
            liblzma-dev \
            libtool \
            pkg-config \
            ripgrep \
            shellcheck \
            unzip \
            zip \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run source checks
        env:
          CLANG_FORMAT: clang-format-22
        run: scripts/check

      - name: Test release packaging helpers
        run: bash scripts/test-windows-package.sh

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure for clang-tidy
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr CC=clang-22

      - name: Build compilation database
        run: |
          set -euxo pipefail
          bear -- make -j"$(nproc)" V=1
          # Build check_PROGRAMS without running TESTS while recording test flags.
          bear --append -- make -j"$(nproc)" check TESTS= V=1

      - name: Run clang-tidy
        run: |
          set -euxo pipefail
          mapfile -t sources < <(git ls-files \
            'src/*.c' 'include/libmpq/*.h')
          if ((${#sources[@]} == 0)); then
            echo 'No C translation units found.' >&2
            exit 1
          fi
          clang-tidy-22 --quiet -p . "${sources[@]}"

      - name: Run clang-tidy on regression tests
        run: |
          set -euxo pipefail
          mapfile -t sources < <(git ls-files 'tests/*.c' 'tests/*.h' | sed 's#^tests/##')
          if ((${#sources[@]} == 0)); then
            echo 'No regression test sources found.' >&2
            exit 1
          fi
          (
            cd tests
            clang-tidy-22 --quiet -p .. "${sources[@]}"
          )

      - name: Run clang-tidy on fuzz harnesses
        run: |
          set -euxo pipefail
          sources=()
          while IFS= read -r source; do
            if [[ "${source}" != 'fuzz/fuzz-codec-decode.c' ]]; then
              sources+=("${source}")
            fi
          done < <(git ls-files 'fuzz/*.c')
          if ((${#sources[@]} == 0)); then
            echo 'No fuzz harnesses found.' >&2
            exit 1
          fi
          clang-tidy-22 --quiet --config-file=.clang-tidy "${sources[@]}" -- \
            -DHAVE_CONFIG_H \
            -I. \
            -Iinclude \
            -Isrc \
            -std=c99 \
            -fvisibility=hidden
          for codec in PKZIP HUFFMAN ZLIB BZIP2 LZMA SPARSE; do
            clang-tidy-22 --quiet --config-file=.clang-tidy fuzz/fuzz-codec-decode.c -- \
              -DHAVE_CONFIG_H \
              -I. \
              -Iinclude \
              -Isrc \
              -DLIBMPQ_FUZZ_CODEC=LIBMPQ_COMPRESSION_${codec} \
              -std=c99 \
              -fvisibility=hidden
          done

  sanitizers:
    name: Sanitizers (ASan, UBSan, LSan)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Install sanitizer build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            clang \
            git \
            libclang-rt-dev \
            libbz2-dev \
            liblzma-dev \
            libtool \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          CC: clang
          CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          LDFLAGS: -fsanitize=address,undefined
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr

      - name: Build with sanitizers
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=1

      - name: Run sanitizer test suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          make check V=1

  native-linux-x64:
    name: Native Linux x86-64 (GCC)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: python:3.11-slim-trixie
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            binutils \
            build-essential \
            ca-certificates \
            gcovr \
            jq \
            git \
            libbz2-dev \
            liblzma-dev \
            libtool \
            pkg-config \
            xz-utils \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure
        env:
          CC: gcc
          CFLAGS: -O0 -g --coverage
          # Keep the coverage runtime private in the shared library.
          LDFLAGS: --coverage -Wl,--exclude-libs,libgcov.a
        run: |
          set -euxo pipefail
          ./configure --prefix=/opt/libmpq \
            --includedir=/opt/libmpq/custom-include \
            --libdir=/opt/libmpq/custom-lib

      - name: Build
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=1

      - name: Run native regression suite
        run: |
          set -euxo pipefail
          # Bound concurrent test memory and disk use while collecting coverage.
          make -j2 check V=1

      - name: Generate coverage reports
        run: |
          set -euxo pipefail
          rm -f a-conftest.gcno
          mkdir -p coverage
          gcovr \
            --root "${GITHUB_WORKSPACE}" \
            --filter "${GITHUB_WORKSPACE}/src/" \
            --print-summary \
            --xml-pretty \
            --output coverage/cobertura.xml
          gcovr \
            --root "${GITHUB_WORKSPACE}" \
            --filter "${GITHUB_WORKSPACE}/src/" \
            --json-summary-pretty \
            --json-summary coverage/summary.json
          bash scripts/coverage-report.sh badge \
            --input coverage/summary.json \
            --output coverage/coverage.svg
          gcovr \
            --root "${GITHUB_WORKSPACE}" \
            --filter "${GITHUB_WORKSPACE}/src/" \
            --html-details coverage/index.html

      - name: Summarize native coverage
        run: |
          set -euo pipefail
          summary="$(jq -ers '
            def percent($metric):
              .[$metric + "_percent"]
              | if type == "number" and . >= 0 and . <= 100 then "\(.)%"
                else error("invalid \($metric) coverage percentage") end;
            if length == 1 then .[0] else error("expected one gcovr coverage summary") end
            | "## Native coverage", "", "| Metric | Coverage |", "| --- | ---: |",
              "| Lines | \(percent("line")) |",
              "| Functions | \(percent("function")) |",
              "| Branches | \(percent("branch")) |"
          ' coverage/summary.json)"
          printf '%s\n' "${summary}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload GCC coverage report
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-gcc-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload GCC coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-gcc-coverage-summary
          path: coverage/summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Archive the x86-64 shared library
        run: |
          set -euxo pipefail
          cd src/.libs
          tar -cf "${RUNNER_TEMP}/libmpq-linux-x64.tar" libmpq.so*

      - name: Upload the x86-64 shared library
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-linux-x64
          path: ${{ runner.temp }}/libmpq-linux-x64.tar
          if-no-files-found: error
          retention-days: 7

  binding-python:
    name: Python 3.11 (pytest)
    needs: native-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.11-slim-trixie
    defaults:
      run:
        shell: bash

    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libbz2-1.0 liblzma5 zlib1g

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the x86-64 shared library
        uses: actions/download-artifact@v7
        with:
          name: libmpq-linux-x64
          path: ${{ runner.temp }}

      - name: Extract the x86-64 shared library
        run: |
          mkdir -p src/.libs
          tar -xf "${RUNNER_TEMP}/libmpq-linux-x64.tar" -C src/.libs

      - name: Test Python bindings against the GCC build
        env:
          LIBMPQ_LIBRARY: ${{ github.workspace }}/src/.libs/libmpq.so
          PYTHONPATH: ${{ github.workspace }}/bindings/python
          # The shared build is instrumented. Prevent binding runs from writing gcov data.
          GCOV_PREFIX: /dev/null
          GCOV_ERROR_FILE: /dev/null
        run: |
          set -euxo pipefail
          python -m pip install pytest
          python -m pytest bindings/python/tests

  binding-java:
    name: Java 22 (Maven/JUnit)
    needs: native-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.11-slim-trixie
    defaults:
      run:
        shell: bash

    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libbz2-1.0 liblzma5 maven zlib1g

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the x86-64 shared library
        uses: actions/download-artifact@v7
        with:
          name: libmpq-linux-x64
          path: ${{ runner.temp }}

      - name: Extract the x86-64 shared library
        run: |
          mkdir -p src/.libs
          tar -xf "${RUNNER_TEMP}/libmpq-linux-x64.tar" -C src/.libs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml

      - name: Test Java bindings against the GCC build
        env:
          GCOV_PREFIX: /dev/null
          GCOV_ERROR_FILE: /dev/null
        run: |
          set -euxo pipefail
          mvn -f bindings/java/pom.xml test \
            -Dorg.libmpq.library="${GITHUB_WORKSPACE}/src/.libs/libmpq.so" \
            -Dlibmpq.sourceDir="${GITHUB_WORKSPACE}"

  binding-d-dmd:
    name: D (DMD, Linux x86-64)
    needs: native-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.11-slim-trixie
    defaults:
      run:
        shell: bash

    steps:
      - name: Install compiler and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git gpg libbz2-1.0 liblzma5 xz-utils zlib1g

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the x86-64 shared library
        uses: actions/download-artifact@v7
        with:
          name: libmpq-linux-x64
          path: ${{ runner.temp }}

      - name: Extract the x86-64 shared library
        run: |
          mkdir -p src/.libs
          tar -xf "${RUNNER_TEMP}/libmpq-linux-x64.tar" -C src/.libs

      - name: Set up DMD
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Test D bindings with DMD
        env:
          LIBRARY_PATH: ${{ github.workspace }}/src/.libs
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/.libs
          GCOV_PREFIX: /dev/null
          GCOV_ERROR_FILE: /dev/null
        run: |
          set -euxo pipefail
          dub run --config=tests --compiler=dmd

  native-linux-ilp32:
    name: Native Linux ${{ matrix.architecture }} (GCC)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: i686
            debian_architecture: i386
          - architecture: ARMv7 armhf
            debian_architecture: armhf
    env:
      DEBIAN_ARCHITECTURE: ${{ matrix.debian_architecture }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and run the native regression suite
        run: |
          set -euxo pipefail
          docker run --rm -i -e DEBIAN_ARCHITECTURE -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            bash -s <<'BASH'
          set -euxo pipefail
          export LC_ALL=C DEBIAN_FRONTEND=noninteractive
          arch="${DEBIAN_ARCHITECTURE}"
          case "${arch}" in
            i386)
              target=i686-linux-gnu
              flags=-march=i686
              runner="qemu-i386 -cpu pentium3 -L /usr/${target}"
              machine='Intel 80386'
              ;;
            armhf)
              target=arm-linux-gnueabihf
              flags='-march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard'
              runner="qemu-arm -cpu cortex-a9,neon=off,vfp-d32=off -L /usr/${target}"
              machine=ARM
              ;;
            *) exit 2 ;;
          esac

          temporary="$(mktemp -d /var/tmp/libmpq-ilp32.XXXXXXXX)"
          trap 'rm -rf -- "${temporary}"' EXIT
          case "$(stat -f -c %T "${temporary}")" in
            tmpfs|ramfs)
              printf 'Use disk-backed storage for the 4 GiB writer regression.\n' >&2
              exit 1
              ;;
          esac
          available="$(df -Pk "${temporary}" | awk 'NR == 2 { print $4 }')"
          if (( available < 12 * 1024 * 1024 )); then
            printf 'The native suites require 12 GiB of free disk space.\n' >&2
            exit 1
          fi

          dpkg --add-architecture "${arch}"
          apt-get update
          apt-get install -y --no-install-recommends autoconf automake libtool make binutils \
            qemu-user "gcc-${target}" "libc6-dev-${arch}-cross" \
            "libbz2-dev:${arch}" "liblzma-dev:${arch}" "zlib1g-dev:${arch}"
          dpkg-query -W "libc6:${arch}" "libc6-${arch}-cross" "libbz2-dev:${arch}" \
            "liblzma-dev:${arch}" "zlib1g-dev:${arch}" "gcc-${target}" qemu-user

          cp -R /workspace "${temporary}/source"
          source_dir="${temporary}/source"
          (cd "${source_dir}" && sh autogen.sh)
          build="${temporary}/gcc"
          sdk="${build}/sdk"
          mkdir "${build}"
          cd "${build}"
          CC="${target}-gcc" CFLAGS="-O2 -g -std=c99 -Wall -Wextra -Wpedantic -Werror ${flags}" \
            "${source_dir}/configure" --build=x86_64-linux-gnu --host="${target}" \
            --prefix="${sdk}" --enable-shared --enable-static
          make -j"$(nproc)"
          make check LOG_COMPILER="${runner}" || { cat tests/test-suite.log; exit 1; }
          grep -Eq '^# SKIP: +0$' tests/test-suite.log
          make install
          cmp "${source_dir}/include/libmpq/mpq.h" "${sdk}/include/libmpq/mpq.h"
          test -s "${sdk}/lib/libmpq.a"
          library="${sdk}/lib/libmpq.so.4"
          bash "${source_dir}/scripts/check-native-exports.sh" \
            "${sdk}/include/libmpq/mpq.h" "${library}"
          readelf -h "${library}" | grep 'Class:.*ELF32'
          readelf -h "${library}" | grep "Machine:[[:space:]]*${machine}$"
          readelf -d "${library}" | grep -F 'Library soname: [libmpq.so.4]'
          if [[ "${arch}" == armhf ]]; then
            readelf -A "${library}" | grep 'Tag_ABI_VFP_args: VFP registers'
          fi
          nm -u src/.libs/mpq-update.o | grep 'fstat64'
          nm -u tests/test_patch_reader-test-mpq-patch-reader.o | grep 'readdir64'
          BASH

  native-linux-s390x:
    name: Native Linux s390x (GCC, big-endian)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU for s390x
        uses: docker/setup-qemu-action@v4
        with:
          platforms: s390x

      - name: Build and test on big-endian s390x
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/s390x \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace debian:trixie-slim \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                autoconf \
                automake \
                build-essential \
                ca-certificates \
                libbz2-dev \
                liblzma-dev \
                libtool \
                zlib1g-dev
              sh autogen.sh
              ./configure --prefix=/usr
              make -j"$(nproc)" V=1
              make check V=1
            '

  coverage-pages:
    name: Publish coverage report
    needs: native-linux-x64
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download GCC coverage report
        uses: actions/download-artifact@v7
        with:
          name: libmpq-gcc-coverage
          path: coverage

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload coverage report to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage

      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v4

  native-linux-arm64:
    name: Native Linux ARM64 (GCC)
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and run the native regression suite
        run: |
          set -euxo pipefail
          test "$(uname -m)" = aarch64
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace quay.io/pypa/manylinux2014_aarch64 \
            bash -euxo pipefail -c '
              yum install -y autoconf automake binutils bzip2-devel findutils \
                gcc libtool make pkgconfig tar xz-devel zlib-devel
              sh autogen.sh
              ./configure --prefix=/usr CC=gcc
              make -j"$(getconf _NPROCESSORS_ONLN)" V=1
              make check
            '

      - name: Archive the ARM64 shared library
        run: |
          set -euxo pipefail
          cd src/.libs
          tar -cf "${RUNNER_TEMP}/libmpq-linux-arm64.tar" libmpq.so*

      - name: Upload the ARM64 shared library
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-linux-arm64
          path: ${{ runner.temp }}/libmpq-linux-arm64.tar
          if-no-files-found: error
          retention-days: 7

  binding-d-ldc:
    name: D (LDC, Linux ARM64)
    needs: native-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the ARM64 shared library
        uses: actions/download-artifact@v7
        with:
          name: libmpq-linux-arm64
          path: ${{ runner.temp }}

      - name: Extract the ARM64 shared library
        run: |
          set -euxo pipefail
          mkdir -p src/.libs
          tar -xf "${RUNNER_TEMP}/libmpq-linux-arm64.tar" -C src/.libs
          LC_ALL=C readelf -h src/.libs/libmpq.so | grep -E 'Machine:[[:space:]]+AArch64$'

      - name: Set up LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Test D bindings with native ARM64 LDC
        env:
          LIBRARY_PATH: ${{ github.workspace }}/src/.libs
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/.libs
        run: |
          set -euxo pipefail
          dub run --config=tests --compiler=ldc2
          LC_ALL=C readelf -h libmpq | grep -E 'Machine:[[:space:]]+AArch64$'

  native-macos:
    name: Native macOS ${{ matrix.architecture_label }} (Apple Clang)
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            architecture_label: x86-64
            runner: macos-15-intel
          - architecture: arm64
            architecture_label: ARM64
            runner: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install macOS build prerequisites
        run: |
          set -euxo pipefail
          brew install autoconf automake libtool pkg-config xz
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "${GITHUB_PATH}"

      - name: Build and run the native regression suite
        run: |
          set -euxo pipefail
          test "$(uname -m)" = '${{ matrix.architecture }}'
          CC="$(xcrun --sdk macosx --find clang)"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"

          # Supply missing liblzma headers without linking Homebrew libraries.
          CPPFLAGS="-I$(brew --prefix xz)/include ${CPPFLAGS:-}"
          export CC SDKROOT CPPFLAGS
          "${CC}" --version
          xcrun --sdk macosx --show-sdk-path
          sh autogen.sh
          ./configure --prefix=/usr --enable-shared --disable-static
          /usr/bin/make -j"$(sysctl -n hw.ncpu)" V=1
          /usr/bin/make check
