name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Install lint dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget
          mkdir -p /etc/apt/keyrings
          wget -qO /etc/apt/keyrings/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          chmod 0644 /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bear \
            build-essential \
            clang-22 \
            clang-format-22 \
            clang-tidy-22 \
            ca-certificates \
            git \
            libbz2-dev \
            libtool \
            pkg-config \
            shellcheck \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run source checks
        env:
          CLANG_FORMAT: clang-format-22
        run: scripts/check

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure for clang-tidy
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr CC=clang-22

      - name: Build compilation database
        run: |
          set -euxo pipefail
          bear -- make -j"$(nproc)" V=1
          bear --append -- make check V=1
          bear --append -- make -C tools crypt_buf_gen V=1

      - name: Run clang-tidy
        run: |
          set -euxo pipefail
          mapfile -t sources < <(git ls-files \
            'src/*.c' 'include/libmpq/*.h' 'tools/*.c' 'tests/*.c' 'tests/*.h')
          if ((${#sources[@]} == 0)); then
            echo 'No C translation units found.' >&2
            exit 1
          fi
          clang-tidy-22 --quiet -p . "${sources[@]}"

  build:
    name: Build (${{ matrix.compiler.name }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: gcc
            package: gcc
            cc: gcc
          - name: clang
            package: clang
            cc: clang

    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            binutils \
            build-essential \
            ca-certificates \
            jq \
            git \
            libbz2-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            ${{ matrix.compiler.package }}

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr CC=${{ matrix.compiler.cc }}

      - name: Build
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=1

      - name: Check
        run: |
          set -euxo pipefail
          make check V=1

  d:
    name: D bindings (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: dmd
            setup: dmd
            dub: dmd
          - name: ldc
            setup: ldc
            dub: ldc2
    defaults:
      run:
        shell: bash

    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            binutils \
            build-essential \
            ca-certificates \
            libbz2-dev \
            jq \
            libtool \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler.setup }}

      - name: Build native library
        run: |
          set -euxo pipefail
          sh autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)" V=1

      - name: Test D bindings
        env:
          LIBRARY_PATH: ${{ github.workspace }}/src/.libs
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/.libs
        run: |
          set -euxo pipefail
          dub run --config=tests --compiler="${{ matrix.compiler.dub }}"

      - name: Build D library
        env:
          LIBRARY_PATH: ${{ github.workspace }}/src/.libs
        run: |
          set -euxo pipefail
          dub build --config=library --compiler="${{ matrix.compiler.dub }}" \
            --build=release

      - name: Test D binary package
        env:
          LIBMPQ_D_COMPILER_NAME: ${{ matrix.compiler.name }}
          LIBMPQ_D_DUB_COMPILER: ${{ matrix.compiler.dub }}
          LIBMPQ_D_LIBC: glibc
        run: |
          set -euxo pipefail
          version="$(./configure --version |
            sed -n '1s/^libmpq configure //p')"
          LIBMPQ_D_VERSION="${version}" bash scripts/package-d-binary.sh

  d-musl:
    name: D musl package (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: dmd
            package: dmd
            dub: dmd
            dc: dmd
          - name: ldc
            package: ldc
            dub: ldc2
            dc: ldc2
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test musl package in Alpine
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          LIBMPQ_D_COMPILER_NAME: ${{ matrix.compiler.name }}
          LIBMPQ_D_COMPILER_PACKAGE: ${{ matrix.compiler.package }}
          LIBMPQ_D_DC: ${{ matrix.compiler.dc }}
          LIBMPQ_D_DUB_COMPILER: ${{ matrix.compiler.dub }}
          LIBMPQ_D_LIBC: musl
        run: |
          set -euxo pipefail
          docker run --rm \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e LIBMPQ_D_COMPILER_NAME \
            -e LIBMPQ_D_COMPILER_PACKAGE \
            -e LIBMPQ_D_DC \
            -e LIBMPQ_D_DUB_COMPILER \
            -e LIBMPQ_D_LIBC \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace alpine:3.22 sh -euxc '
              apk add --no-cache autoconf automake bash binutils bzip2-dev \
                build-base ca-certificates dub jq libtool linux-headers \
                "${LIBMPQ_D_COMPILER_PACKAGE}" tar zlib-dev
              sh autogen.sh
              ./configure --prefix=/usr
              project_version="$(./configure --version |
                sed -n "1s/^libmpq configure //p")"
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                test "${project_version}" = "${GITHUB_REF_NAME#v}"
              fi
              make -j"$(getconf _NPROCESSORS_ONLN)" V=1
              export DC="${LIBMPQ_D_DC}"
              export LIBRARY_PATH="$PWD/src/.libs"
              export LD_LIBRARY_PATH="$PWD/src/.libs"
              dub run --config=tests --compiler="${LIBMPQ_D_DUB_COMPILER}"
              dub build --config=library --compiler="${LIBMPQ_D_DUB_COMPILER}" \
                --build=release
              version="${GITHUB_REF_NAME#v}"
              if [[ "${GITHUB_REF_NAME}" != v* ]]; then
                version="${project_version}"
              fi
              export LIBMPQ_D_VERSION="${version}"
              bash scripts/package-d-binary.sh
            '

  java:
    name: Java bindings (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['22', '25']
    defaults:
      run:
        shell: bash

    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            libbz2-dev \
            libtool \
            maven \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: bindings/java/pom.xml

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Build native library
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr
          make -j"$(nproc)" V=1

      - name: Test Java bindings
        run: |
          set -euxo pipefail
          mvn -f bindings/java/pom.xml test \
            -Dorg.libmpq.library="${GITHUB_WORKSPACE}/src/.libs/libmpq.so" \
            -Dlibmpq.sourceDir="${GITHUB_WORKSPACE}"

  python:
    name: Python bindings (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash

    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            libbz2-dev \
            libtool \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Install Python test tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip pytest build setuptools wheel

      - name: Build native library
        run: |
          set -euxo pipefail
          sh autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)" V=1

      - name: Test Python bindings
        env:
          LIBMPQ_LIBRARY: ${{ github.workspace }}/src/.libs/libmpq.so
          PYTHONPATH: ${{ github.workspace }}/bindings/python
        run: |
          set -euxo pipefail
          python -m pytest bindings/python/tests

      - name: Build Python package smoke artifact
        working-directory: bindings/python
        run: |
          set -euxo pipefail
          python -m build --wheel --no-isolation
