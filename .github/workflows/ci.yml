name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Install lint dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget
          mkdir -p /etc/apt/keyrings
          wget -qO /etc/apt/keyrings/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          chmod 0644 /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bear \
            build-essential \
            clang-22 \
            clang-format-22 \
            clang-tidy-22 \
            ca-certificates \
            git \
            libbz2-dev \
            libtool \
            pkg-config \
            shellcheck \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run source checks
        env:
          CLANG_FORMAT: clang-format-22
        run: scripts/check

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure for clang-tidy
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr CC=clang-22

      - name: Build compilation database
        run: |
          set -euxo pipefail
          bear -- make -j"$(nproc)" V=1
          bear --append -- make check V=1
          bear --append -- make -C tools crypt_buf_gen V=1

      - name: Run clang-tidy
        run: |
          set -euxo pipefail
          mapfile -t sources < <(git ls-files \
            'src/*.c' 'include/libmpq/*.h' 'tools/*.c' 'tests/*.c' 'tests/*.h')
          if ((${#sources[@]} == 0)); then
            echo 'No C translation units found.' >&2
            exit 1
          fi
          clang-tidy-22 --quiet -p . "${sources[@]}"

      - name: Run clang-tidy on fuzz harnesses
        run: |
          set -euxo pipefail
          mapfile -t sources < <(git ls-files 'fuzz/*.c')
          if ((${#sources[@]} == 0)); then
            echo 'No fuzz harnesses found.' >&2
            exit 1
          fi
          clang-tidy-22 --quiet --config-file=.clang-tidy "${sources[@]}" -- \
            -DHAVE_CONFIG_H \
            -I. \
            -Iinclude \
            -Isrc \
            -std=c99 \
            -fvisibility=hidden

  sanitizers:
    name: Sanitizers (ASan, UBSan, LSan)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Install sanitizer build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            clang \
            git \
            libclang-rt-dev \
            libbz2-dev \
            libtool \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          CC: clang
          CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          LDFLAGS: -fsanitize=address,undefined
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr

      - name: Build with sanitizers
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=1

      - name: Run sanitizer test suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          make check V=1

  fuzz:
    name: Fuzzing
    needs: lint
    uses: ./.github/workflows/fuzz.yml
    with:
      max_total_time: 60

  build:
    name: Build (${{ matrix.compiler.name }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: gcc
            package: gcc
            cc: gcc
          - name: clang
            package: clang
            cc: clang

    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            binutils \
            build-essential \
            ca-certificates \
            jq \
            git \
            libbz2-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            ${{ matrix.compiler.package }}

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure
        run: |
          set -euxo pipefail
          ./configure --prefix=/opt/libmpq \
            --includedir=/opt/libmpq/custom-include \
            --libdir=/opt/libmpq/custom-lib \
            CC=${{ matrix.compiler.cc }}

      - name: Build
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=1

      - name: Check
        run: |
          set -euxo pipefail
          make check V=1

  native-glibc:
    name: Native C SDK package (glibc)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test the manylinux SDK package
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace quay.io/pypa/manylinux2014_x86_64 \
            bash -euxo pipefail -c '
              yum install -y autoconf automake binutils bzip2-devel findutils \
                gcc libtool make pkgconfig tar zlib-devel
              sh autogen.sh
              ./configure --prefix=/usr
              make -j"$(getconf _NPROCESSORS_ONLN)" V=1
              version="$(./configure --version | sed -n "1s/^libmpq configure //p")"
              LIBMPQ_NATIVE_LIBC=glibc \
                LIBMPQ_NATIVE_VERSION="${version}" \
                LIBMPQ_NATIVE_BUILD_ENVIRONMENT=manylinux2014_x86_64 \
                LIBMPQ_NATIVE_GLIBC_BASELINE=2.17 \
                bash scripts/package-native-binary.sh
              bash scripts/test-native-package.sh \
                "release/libmpq-${version}-linux-glibc-x86_64.tar.gz" \
                tests/fixtures/mpq-v1-features.mpq
            '

  native-musl:
    name: Native C SDK package (musl)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test the Alpine SDK package
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace quay.io/pypa/musllinux_1_2_x86_64 bash -euxo pipefail -c '
              apk add --no-cache autoconf automake bash binutils bzip2-dev \
                build-base libtool linux-headers pkgconf tar zlib-dev
              sh autogen.sh
              ./configure --prefix=/usr
              make -j"$(getconf _NPROCESSORS_ONLN)" V=1
              version="$(./configure --version | sed -n "1s/^libmpq configure //p")"
              LIBMPQ_NATIVE_LIBC=musl \
                LIBMPQ_NATIVE_VERSION="${version}" \
                LIBMPQ_NATIVE_BUILD_ENVIRONMENT=musllinux_1_2_x86_64 \
                LIBMPQ_NATIVE_MUSL_BASELINE=1.2 \
                bash scripts/package-native-binary.sh
              bash scripts/test-native-package.sh \
                "release/libmpq-${version}-linux-musl-x86_64.tar.gz" \
                tests/fixtures/mpq-v1-features.mpq
            '

  d-packages:
    name: Validate D packages
    uses: ./.github/workflows/release-d.yml
    with:
      mode: validate
      assemble_release: false

  java:
    name: Java bindings (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['22', '25']
    defaults:
      run:
        shell: bash

    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            libbz2-dev \
            libtool \
            maven \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: bindings/java/pom.xml

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Build native library
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr
          make -j"$(nproc)" V=1

      - name: Test Java bindings
        run: |
          set -euxo pipefail
          mvn -f bindings/java/pom.xml test \
            -Dorg.libmpq.library="${GITHUB_WORKSPACE}/src/.libs/libmpq.so" \
            -Dlibmpq.sourceDir="${GITHUB_WORKSPACE}"

  python:
    name: Python bindings (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash

    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            libbz2-dev \
            libtool \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Install Python test tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip pytest build setuptools wheel

      - name: Build native library
        run: |
          set -euxo pipefail
          sh autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)" V=1

      - name: Test Python bindings
        env:
          LIBMPQ_LIBRARY: ${{ github.workspace }}/src/.libs/libmpq.so
          PYTHONPATH: ${{ github.workspace }}/bindings/python
        run: |
          set -euxo pipefail
          python -m pytest bindings/python/tests

      - name: Build Python package smoke artifact
        working-directory: bindings/python
        run: |
          set -euxo pipefail
          python -m build --wheel --no-isolation

      - name: Test installed Python wheel
        run: |
          set -euxo pipefail
          wheel="$(find bindings/python/dist -maxdepth 1 -name '*.whl' \
            -print -quit)"
          test -s "${wheel}"
          temporary="$(mktemp -d)"
          trap 'rm -rf "${temporary}"' EXIT
          python -m venv --system-site-packages "${temporary}/venv"
          "${temporary}/venv/bin/python" -m pip install "${wheel}"
          (
            cd /tmp
            env -u LIBMPQ_LIBRARY -u PYTHONPATH \
              LIBMPQ_EXPECT_BUNDLED=1 \
              "${temporary}/venv/bin/python" -m pytest \
              "${GITHUB_WORKSPACE}/bindings/python/tests"
          )
