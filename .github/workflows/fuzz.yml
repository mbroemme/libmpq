name: Fuzzing

on:
  workflow_call:
    inputs:
      max_total_time:
        description: Maximum fuzzing time in seconds for each target.
        required: false
        default: 60
        type: number
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzzing time in seconds for each target.
        required: true
        default: 900
        type: choice
        options:
          - '60'
          - '900'

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (ASan, UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash
    env:
      FUZZ_SECONDS: ${{ inputs.max_total_time || '900' }}

    steps:
      - name: Install fuzzing build dependencies
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            clang \
            git \
            libclang-rt-dev \
            libbz2-dev \
            libtool \
            zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust repository checkout
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate build system
        run: |
          set -euxo pipefail
          sh autogen.sh

      - name: Configure fuzzers
        env:
          ASAN_OPTIONS: detect_leaks=0
          CC: clang
          CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=fuzzer-no-link,address,undefined
          LDFLAGS: -fsanitize=address,undefined
        run: |
          set -euxo pipefail
          ./configure --prefix=/usr --enable-fuzzing

      - name: Build fuzzers
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=1

      - name: Generate fuzzing corpus
        run: |
          set -euxo pipefail
          scripts/generate-fuzz-corpus.sh "$RUNNER_TEMP/libmpq-fuzz-corpus"

      - name: Run fuzzing campaigns
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          artifact_root="$RUNNER_TEMP/libmpq-fuzz-artifacts"
          mkdir -p "$artifact_root/archive-open" "$artifact_root/sector-decode"

          fuzz/fuzz-archive-open \
            -artifact_prefix="$artifact_root/archive-open/" \
            -max_len=1048576 \
            -max_total_time="$FUZZ_SECONDS" \
            -rss_limit_mb=512 \
            -timeout=5 \
            "$RUNNER_TEMP/libmpq-fuzz-corpus/archive-open" 2>&1 | \
            tee "$artifact_root/archive-open.log"
          fuzz/fuzz-sector-decode \
            -artifact_prefix="$artifact_root/sector-decode/" \
            -max_len=1048576 \
            -max_total_time="$FUZZ_SECONDS" \
            -rss_limit_mb=512 \
            -timeout=5 \
            "$RUNNER_TEMP/libmpq-fuzz-corpus/sector-decode" 2>&1 | \
            tee "$artifact_root/sector-decode.log"

      - name: Upload fuzzing failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-fuzz-failure-artifacts
          path: ${{ runner.temp }}/libmpq-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14
