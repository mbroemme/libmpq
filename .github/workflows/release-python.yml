name: Build Python package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manylinux:
    name: Build Python manylinux wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp311-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y bzip2-devel zlib-devel
            && auditwheel --version
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_17_x86_64
            --only-plat
            -w {dest_dir} {wheel}
            && auditwheel show {dest_dir}/*.whl
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            LIBMPQ_EXPECT_BUNDLED=1 python -m pytest
            {project}/bindings/python/tests
        with:
          package-dir: bindings/python

      - name: Upload manylinux wheel
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-python-manylinux-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  musllinux:
    name: Build Python musllinux wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp311-musllinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_BEFORE_ALL_LINUX: >-
            apk add --no-cache bzip2-dev zlib-dev
            && auditwheel --version
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat musllinux_1_2_x86_64
            --only-plat
            -w {dest_dir} {wheel}
            && auditwheel show {dest_dir}/*.whl
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            LIBMPQ_EXPECT_BUNDLED=1 python -m pytest
            {project}/bindings/python/tests
        with:
          package-dir: bindings/python

      - name: Upload musllinux wheel
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-python-musllinux-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Build Python release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libbz2-dev zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and inspect sdist
        working-directory: bindings/python
        run: |
          set -euxo pipefail
          python -m pip install --upgrade build
          python -m build --sdist
          sdist="$(find dist -maxdepth 1 -name 'libmpq-*.tar.gz' -print -quit)"
          test -s "${sdist}"
          tar -tzf "${sdist}" | grep -E '/(src|include)/' >/dev/null
          if tar -tzf "${sdist}" | grep -E '\.(so|dylib|dll)$'; then
            echo 'sdist unexpectedly contains a native binary' >&2
            exit 1
          fi
          extracted="$(mktemp -d)"
          trap 'rm -rf "${extracted}"' EXIT
          tar -xzf "${sdist}" -C "${extracted}"
          source_dir="$(find "${extracted}" -mindepth 1 -maxdepth 1 \
            -type d -print -quit)"
          test -n "${source_dir}"
          python -m build --wheel "${source_dir}" \
            --outdir "${extracted}/wheelhouse"
          python -m venv "${extracted}/venv"
          "${extracted}/venv/bin/python" -m pip install --upgrade pip pytest
          "${extracted}/venv/bin/python" -m pip install \
            "${extracted}/wheelhouse/"*.whl
          (
            cd /tmp
            LIBMPQ_EXPECT_BUNDLED=1 \
              "${extracted}/venv/bin/python" -m pytest \
              "${source_dir}/tests" -k 'not fixture_metadata_and_extraction'
          )

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  package:
    name: Package Python release
    needs: [manylinux, musllinux, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download manylinux wheel
        uses: actions/download-artifact@v8
        with:
          name: libmpq-python-manylinux-wheel
          path: release/wheels/manylinux

      - name: Download musllinux wheel
        uses: actions/download-artifact@v8
        with:
          name: libmpq-python-musllinux-wheel
          path: release/wheels/musllinux

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: libmpq-python-sdist
          path: release/sdist

      - name: Package Python release
        id: package
        run: |
          set -euxo pipefail
          sdist="$(find release/sdist -maxdepth 1 -name 'libmpq-*.tar.gz' \
            -print -quit)"
          test -s "${sdist}"
          version="$(basename "${sdist}" .tar.gz)"
          version="${version#libmpq-}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "${version}" != "${tag_version}" ]]; then
              echo "Package version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi
          mkdir -p release/package
          find release/wheels -type f -name '*.whl' \
            -exec cp {} release/package/ \;
          cp "${sdist}" release/package/
          (
            cd release/package
            zip -q "../libmpq-python-${version}.zip" ./*
          )
          unzip -t "release/libmpq-python-${version}.zip"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload Python release artifact
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-python-release
          path: release/libmpq-python-*.zip
          if-no-files-found: error
