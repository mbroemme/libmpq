name: Build Python package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: Build Python ${{ matrix.platform }} wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            build: cp311-manylinux_x86_64
            artifact: libmpq-python-manylinux-wheel
          - platform: musllinux
            build: cp311-musllinux_x86_64
            artifact: libmpq-python-musllinux-wheel
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.build }}
        with:
          package-dir: bindings/python

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Build Python release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install native build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libbz2-dev zlib1g-dev

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and inspect sdist
        run: |
          set -euxo pipefail
          python -m pip install --upgrade build
          scripts/test-python-sdist.sh bindings/python/dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  package:
    name: Package Python release
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: libmpq-python-*-wheel
          path: release/wheels
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: libmpq-python-sdist
          path: release/sdist

      - name: Package Python release
        id: package
        run: |
          set -euxo pipefail
          sdist="$(find release/sdist -maxdepth 1 -name 'libmpq-*.tar.gz' \
            -print -quit)"
          test -s "${sdist}"
          version="$(basename "${sdist}" .tar.gz)"
          version="${version#libmpq-}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "${version}" != "${tag_version}" ]]; then
              echo "Package version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi
          mkdir -p release/package
          find release/wheels -type f -name '*.whl' \
            -exec cp {} release/package/ \;
          cp "${sdist}" release/package/
          (
            cd release/package
            zip -q "../libmpq-python-${version}.zip" ./*
          )
          unzip -t "release/libmpq-python-${version}.zip"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload Python release artifact
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-python-release
          path: release/libmpq-python-*.zip
          if-no-files-found: error
