name: Publish Java bindings

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Maven Central deployment mode
        required: true
        type: choice
        default: validate
        options:
          - validate
          - release

concurrency:
  group: publish-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      expected_version: ${{ steps.guard.outputs.expected_version }}
    steps:
      - id: guard
        name: Validate release tag
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == release ]]; then
            [[ "${GITHUB_REF}" == refs/tags/v* ]] || {
              echo 'Release deployment requires an existing v* tag.' >&2; exit 1; }
            echo "expected_version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: maven-central
    timeout-minutes: 30
    steps:
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake build-essential libbz2-dev libtool unzip zlib1g-dev zip
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Build and validate Java release package
        env:
          LIBMPQ_JAVA_EXPECTED_VERSION: ${{ needs.validate.outputs.expected_version }}
        run: bash scripts/build-java-package.sh
      - name: Import signing key and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${MAVEN_CENTRAL_USERNAME}"
          test -n "${MAVEN_CENTRAL_PASSWORD}"
          test -n "${MAVEN_GPG_PRIVATE_KEY}"
          test -n "${MAVEN_GPG_PASSPHRASE}"
          gpg_home="$(mktemp -d)"
          settings_home="$(mktemp -d)"
          export GNUPGHOME="${gpg_home}"
          trap 'rm -rf -- "${gpg_home}" "${settings_home}"' EXIT
          chmod 0700 "${GNUPGHOME}"
          printf '%s\n' "${MAVEN_GPG_PRIVATE_KEY}" | gpg --batch --import
          cat > "${settings_home}/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -s "${settings_home}/settings.xml" -f bindings/java/pom.xml \
            -Pmaven-central deploy \
            -Dorg.libmpq.library="${GITHUB_WORKSPACE}/src/.libs/libmpq.so" \
            -Dlibmpq.sourceDir="${GITHUB_WORKSPACE}"
          if [[ "${{ inputs.mode }}" == validate ]]; then
            echo 'Maven Central validation deployment completed successfully.'
            echo 'This deployment was created for testing and remains USER_MANAGED.'
            echo 'Review the deployment in the Central Portal and DROP it. Do not publish this validation deployment.'
          else
            echo 'Maven Central release deployment validated successfully.'
            echo 'The deployment remains USER_MANAGED and has not been published.'
            echo 'Review it in the Central Portal and choose Publish or Drop.'
          fi
