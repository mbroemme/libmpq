name: Build source package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build source release archives
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install release dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bzip2 \
            build-essential \
            coreutils \
            gawk \
            git \
            gzip \
            libbz2-dev \
            liblzma-dev \
            libtool \
            make \
            tar \
            zlib1g-dev \
            xz-utils \
            cmake

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        run: bash scripts/validate-release.sh

      - name: Build and validate configure-ready source archives
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euxo pipefail
          sh autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)"
          make check
          make distcheck
          make dist-bzip2
          mkdir -p dist
          mv "libmpq-${RELEASE_VERSION}.tar.gz" "libmpq-${RELEASE_VERSION}.tar.bz2" dist/
          for archive in dist/*.tar.*; do
            tar -tf "${archive}" | grep -Fx "libmpq-${RELEASE_VERSION}/CMakeLists.txt"
            tar -tf "${archive}" | grep -Fx "libmpq-${RELEASE_VERSION}/configure"
          done
          temporary="$(mktemp -d)"
          trap 'rm -rf "${temporary}"' EXIT
          tar -xzf "dist/libmpq-${RELEASE_VERSION}.tar.gz" -C "${temporary}"
          cmake -S "${temporary}/libmpq-${RELEASE_VERSION}" -B "${temporary}/build" -DBUILD_SHARED_LIBS=ON
          cmake --build "${temporary}/build" --parallel
          ctest --test-dir "${temporary}/build" --output-on-failure

      - name: Upload source release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-source-release
          path: |
            dist/libmpq-*.tar.gz
            dist/libmpq-*.tar.bz2
          if-no-files-found: error
