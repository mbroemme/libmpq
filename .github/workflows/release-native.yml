name: Build native C SDK package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-glibc:
    name: Build native glibc SDK package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test the manylinux SDK package
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          docker run --rm \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace quay.io/pypa/manylinux2014_x86_64 \
            bash -euxo pipefail -c '
              yum install -y autoconf automake binutils bzip2-devel findutils \
                gcc libtool make pkgconfig tar zlib-devel
              sh autogen.sh
              ./configure --prefix=/usr
              make -j"$(getconf _NPROCESSORS_ONLN)" V=1
              version="$(./configure --version | sed -n "1s/^libmpq configure //p")"
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                test "${version}" = "${GITHUB_REF_NAME#v}"
              fi
              LIBMPQ_NATIVE_LIBC=glibc \
                LIBMPQ_NATIVE_VERSION="${version}" \
                LIBMPQ_NATIVE_BUILD_ENVIRONMENT=manylinux2014_x86_64 \
                LIBMPQ_NATIVE_GLIBC_BASELINE=2.17 \
                bash scripts/package-native-binary.sh
              bash scripts/test-native-package.sh \
                "release/libmpq-${version}-linux-glibc-x86_64.tar.gz" \
                tests/fixtures/mpq-v1-features.mpq
            '

      - name: Upload native glibc SDK package
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-native-glibc-package
          path: release/libmpq-*-linux-glibc-x86_64.tar.gz
          if-no-files-found: error

  binary-musl:
    name: Build native musl SDK package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test the Alpine SDK package
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          docker run --rm \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace quay.io/pypa/musllinux_1_2_x86_64 bash -euxo pipefail -c '
              apk add --no-cache autoconf automake bash binutils bzip2-dev \
                build-base libtool linux-headers pkgconf tar zlib-dev
              sh autogen.sh
              ./configure --prefix=/usr
              make -j"$(getconf _NPROCESSORS_ONLN)" V=1
              version="$(./configure --version | sed -n "1s/^libmpq configure //p")"
              case "${GITHUB_REF}" in
                refs/tags/v*) test "${version}" = "${GITHUB_REF_NAME#v}" ;;
              esac
              LIBMPQ_NATIVE_LIBC=musl \
                LIBMPQ_NATIVE_VERSION="${version}" \
                LIBMPQ_NATIVE_BUILD_ENVIRONMENT=musllinux_1_2_x86_64 \
                LIBMPQ_NATIVE_MUSL_BASELINE=1.2 \
                bash scripts/package-native-binary.sh
              bash scripts/test-native-package.sh \
                "release/libmpq-${version}-linux-musl-x86_64.tar.gz" \
                tests/fixtures/mpq-v1-features.mpq
            '

      - name: Upload native musl SDK package
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-native-musl-package
          path: release/libmpq-*-linux-musl-x86_64.tar.gz
          if-no-files-found: error

  package:
    name: Assemble native C SDK release
    needs: [binary-glibc, binary-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Download native SDK packages
        uses: actions/download-artifact@v8
        with:
          pattern: libmpq-native-*-package
          path: release/packages
          merge-multiple: true

      - name: Assemble native C SDK ZIP
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" != v* ]]; then
            echo 'Native release packaging requires a v* tag.' >&2
            exit 1
          fi
          mapfile -t packages < <(
            find release/packages -maxdepth 1 -type f \
              -name "libmpq-${version}-linux-*.tar.gz" -print | sort
          )
          if ((${#packages[@]} == 0)); then
            echo 'No native SDK packages were downloaded.' >&2
            exit 1
          fi
          mkdir -p release/package
          cp "${packages[@]}" release/package/
          (
            cd release/package
            zip -q "../libmpq-native-${version}.zip" ./*
          )
          unzip -t "release/libmpq-native-${version}.zip"

      - name: Upload native C SDK release
        uses: actions/upload-artifact@v7
        with:
          name: libmpq-native-release
          path: release/libmpq-native-*.zip
          if-no-files-found: error
